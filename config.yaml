# =====================================================================
#  Настройки поиска ниш. Меняйте только значения справа от двоеточия.
#  Всё, что после знака #, — пояснения, программа их не читает.
# =====================================================================

# --- Сколько работать за один запуск -------------------------------------
# Приватный репозиторий на бесплатном плане GitHub: не больше 50
#   (там лимит 2000 минут в месяц, а запуск каждый день).
# Публичный репозиторий: можно поставить 150 — тогда за день обойдёт больше.
time_budget_minutes: 50

# --- Вежливость к Apple ---------------------------------------------------
# Apple разрешает примерно 20 запросов в минуту к своему API.
# Если в логах часто пишет «Apple просит притормозить» — увеличьте паузы.
pause_api_sec: 3.1      # поиск и Lookup
pause_rss_sec: 1.5      # чарты
pause_page_sec: 2.5     # страницы приложений (похожие приложения)

# --- Что отслеживать ------------------------------------------------------
include_games: true          # false = игры не собирать
min_ratings_to_track: 20     # новые приложения с меньшим числом оценок не берём
max_tracked_apps: 40000      # потолок базы; лишние (самые слабые) удаляются
history_points: 120          # сколько дней истории оценок хранить

# --- Как считать прирост оценок -------------------------------------------
growth_window_days: 14   # сравниваем с замером примерно 14 дней назад
growth_min_days: 3       # минимум дней между замерами, чтобы считать прирост
chart_memory_days: 30    # сколько дней помнить, кто был в Grossing-чарте

# --- Поиск новых приложений -----------------------------------------------
keywords_per_day: 150        # сколько поисковых запросов делать в день (по кругу)
suggest_seeds_per_day: 40    # сколько запросов расширять автоподсказками App Store
max_auto_keywords: 3000      # предел автоматически найденных запросов

developers_per_day: 80       # у скольких разработчиков смотреть другие приложения
pages_per_day: 150           # сколько страниц App Store открыть (похожие + есть ли платные функции)
explore_min_revenue: 2000    # исследуем окрестности приложений от этой выручки, $/мес
explore_max_revenue: 150000  # ...и (в первую очередь) до этой
revisit_days: 30             # через сколько дней повторно смотреть того же разработчика/страницу

# --- Модель выручки (всё ориентировочно) ----------------------------------
# Выручка в месяц у приложения на 200-м месте общего Grossing-чарта США.
revenue_at_overall_rank_200: 200000
# Насколько круто растёт выручка к верху чарта (1.0–1.2 — обычные значения).
rank_exponent: 1.1
# Запасное значение «$ выручки в месяц на одну новую оценку»,
# если не на ком откалиброваться (обычно не используется).
default_revenue_per_new_rating: 60
# Сколько скачиваний приходится на одну оценку (только для колонки «скачиваний/день»).
downloads_per_rating: 60

# --- Реальная выручка из открытых источников (файл known_revenue.csv) -----
us_share_of_world: 0.5       # доля США в выручке, если в источнике указан весь мир
known_max_age_days: 180      # более старые цифры не используются

# --- Кандидаты ------------------------------------------------------------
candidates:
  max_age_days: 730          # не старше 2 лет (365 = 1 год)
  min_revenue: 5000          # $/мес
  max_revenue: 50000         # $/мес
  min_ratings_per_day: 0.5   # минимум новых оценок в день (не действует на «много денег на скачивание»)
  max_total_ratings: 5000    # максимум оценок всего
  hide_heavy_games: true     # false = тяжёлые жанры игр тоже попадают в кандидаты

# --- Много денег на одно скачивание ---------------------------------------
# Приложение из чарта (или с известной выручкой) получает отметку, если зарабатывает
# во столько раз больше обычного для своей категории при таком же приросте оценок.
eff_ratio: 3

# --- Крупные разработчики («студии») --------------------------------------
studio_min_apps: 10          # приложений у разработчика в базе, от
studio_min_revenue: 300000   # или общая выручка всех его приложений, $/мес, от

# --- Ниши (поисковые запросы) ---------------------------------------------
niche_top: 10                # сколько первых мест выдачи смотреть
niche_new_days: 365          # «новичок» — приложение не старше стольких дней
niche_keep_days: 60          # не показывать запросы, которые давно не проверялись

# --- Категории в фильтре на сайте (собираются всё равно все) --------------
site_categories: [Health & Fitness, Productivity, Utilities, Education, Lifestyle, Photo & Video, Medical, Sports]
site_game_genres: [Trivia, Word, Family, Board, Card]
heavy_game_genres: [Action, Strategy, Role Playing, Racing, Casino, Simulation]

# --- Что показывать на сайте ----------------------------------------------
export_min_revenue: 1000     # в общую таблицу попадают приложения от этой выручки
export_max_rows: 20000       # и не больше стольких строк (иначе сайт тормозит)
